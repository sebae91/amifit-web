<?xml version="1.0" encoding="UTF-8"?>
<!-- AmiFit glyph favicon: transparent background; black in light mode, white in dark mode -->
<!-- same shapes as logo.svg, minus the background; fork slots carved with a mask -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <style>
    #glyph { color: #000000; }
    @media (prefers-color-scheme: dark) { #glyph { color: #ffffff; } }
  </style>
  <defs>
    <!-- black areas of a mask are cut out of whatever it is applied to -->
    <mask id="slots">
      <rect x="0" y="0" width="1024" height="1024" fill="white"/>
      <rect x="578.5" y="300" width="27.5" height="80.5" rx="4" fill="black"/>
      <rect x="630" y="300" width="27.5" height="80.5" rx="4" fill="black"/>
    </mask>
  </defs>

  <g id="glyph" mask="url(#slots)">
    <g fill="none" stroke="currentColor" stroke-linecap="round">
      <!-- circle (face) -->
      <circle cx="512" cy="512" r="402" stroke-width="45"/>
      <!-- inside: a half circle (smile), 180-degree arc -->
      <path d="M 234 512 A 278 278 0 0 0 790 512" stroke-width="40.5"/>
    </g>
    <g fill="currentColor" stroke="none">
      <!-- left eye: spoon = vertical ellipse (bowl) + rounded handle stub below -->
      <ellipse cx="406" cy="373.5" rx="63.5" ry="102.5"/>
      <rect x="385.75" y="440" width="40.5" height="103" rx="20.25"/>
      <!-- right eye: fork = head block + belly + handle + 3 rounded tines -->
      <rect x="554.5" y="376" width="127" height="39.5"/>
      <path d="M 554.5 411.5 A 63.5 66 0 0 0 681.5 411.5 Z"/>
      <rect x="597.75" y="440" width="40.5" height="103" rx="20.25"/>
      <rect x="554.5" y="271" width="24" height="140" rx="12"/>
      <rect x="606" y="271" width="24" height="140" rx="12"/>
      <rect x="657.5" y="271" width="24" height="140" rx="12"/>
    </g>
  </g>
</svg>
