<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>App Store Screenshot Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 40px;
      gap: 60px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }

    .label {
      color: #666;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: -44px;
      align-self: flex-start;
      margin-left: calc(50% - 220px);
    }

    /* 1320×2868 scaled to 1/3 = 440×956 */
    .composition {
      width: 440px;
      height: 956px;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 32px 20px;
      gap: 28px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand img {
      height: 28px;
      width: auto;
    }

    .brand-name {
      color: #fff;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .headline {
      color: #fff;
      font-size: 32px;
      font-weight: 300;
      text-align: center;
      line-height: 1.25;
      letter-spacing: -0.4px;
    }

    .headline strong {
      font-weight: 700;
    }

    .headline .light {
      font-weight: 300;
    }

    .screenshot {
      width: 92%;
      height: auto;
      max-height: 720px;
      object-fit: contain;
      border-radius: 36px;
      border: 2px solid rgba(255, 255, 255, 0.55);
    }
  </style>
</head>
<body>

  <p class="label">1 — Diary (EN)</p>
  <div class="composition">
    <div class="top">
      <div class="brand">
        <img src="assets/img/amifit_no_bg_dark.png" alt="AmiFit">
        <span class="brand-name">AmiFit</span>
      </div>
      <p class="headline"><span class="light">No account ever created.</span> <strong>Fully offline.</strong></p>
    </div>
    <img class="screenshot" src="assets/img/appstore/diary_en.png">
  </div>


</body>
</html>
